<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>J'serai — Créez votre affiche</title>
    <meta name="description" content="Ajoutez votre photo et votre nom sur l'affiche J'serai, téléchargez-la et partagez-la.">
    <meta property="og:title" content="J'serai — Créez votre affiche">
    <meta property="og:description" content="Ajoutez votre photo et votre nom, téléchargez et partagez votre affiche.">
    <meta property="og:image" content="assets/affiche.png">
    <meta name="theme-color" content="#E5940F">
    <link rel="icon" href="assets/affiche.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="entete">
    <h1 id="titre">J'serai</h1>
    <p id="sous-titre"></p>
</header>

<div class="avis-local" id="avis-local" hidden></div>

<main class="app">
    <section class="apercu" aria-label="Aperçu de l'affiche">
        <div class="cadre">
            <canvas id="toile" width="1080" height="1350" aria-label="Aperçu de votre affiche"></canvas>
            <p class="chargement" id="chargement">Chargement de l'affiche…</p>
        </div>
        <p class="aide" id="aide-geste">Astuce : faites glisser la photo pour la déplacer, pincez ou utilisez le curseur pour zoomer.</p>
    </section>

    <section class="panneau" aria-label="Personnalisation">
        <div class="etape">
            <h2><span>1</span> Votre photo</h2>
            <input type="file" id="fichier-photo" accept="image/*" hidden>
            <button type="button" class="btn btn-principal" id="btn-photo">📷 Choisir ma photo</button>
            <div class="reglage" id="reglage-zoom" hidden>
                <label for="zoom">Zoom</label>
                <input type="range" id="zoom" min="1" max="3" step="0.01" value="1">
                <button type="button" class="btn-lien" id="btn-recentrer">Recentrer</button>
            </div>
            <p class="confidentialite">🔒 Votre photo reste sur votre appareil : elle n'est envoyée nulle part.</p>
        </div>

        <div class="etape">
            <h2><span>2</span> Téléchargez et partagez</h2>
            <div class="boutons">
                <button type="button" class="btn btn-principal" id="btn-telecharger">⬇ Télécharger mon affiche</button>
                <button type="button" class="btn btn-noir" id="btn-partager">📤 Partager mon affiche</button>
            </div>
            <p class="message" id="message" role="status"></p>

            <h3>Invitez vos amis à créer la leur</h3>
            <div class="boutons-lien">
                <a class="btn-reseau wa" id="lien-whatsapp" target="_blank" rel="noopener">WhatsApp</a>
                <a class="btn-reseau fb" id="lien-facebook" target="_blank" rel="noopener">Facebook</a>
                <button type="button" class="btn-reseau cp" id="btn-copier">🔗 Copier le lien</button>
            </div>
        </div>
    </section>
</main>

<footer class="pied"><p id="credit"></p></footer>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
